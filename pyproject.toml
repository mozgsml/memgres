[project]
name = "memgres"
dynamic = ["version"]      # single source: memgres/_version.py (read at build time)
description = "Drop-in memory for AI agents: one Postgres, lexical + semantic recall, diff-versioned history, GDPR-erasable."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["agent", "memory", "postgres", "pgvector", "qdrant", "embeddings", "semantic-search", "llm", "mcp", "rag"]
authors = [{ name = "mozgsml" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "pysbd>=0.3",   # sentence segmentation for semantic snippets (pure-Python, ~69 KB, no deps)
]

[project.urls]
Homepage = "https://github.com/mozgsml/memgres"
Repository = "https://github.com/mozgsml/memgres"
Issues = "https://github.com/mozgsml/memgres/issues"

[project.optional-dependencies]
# Semantic recall backends — install only what you use. Cloud embeddings
# (Jina/OpenAI) use the stdlib, so they need no extra.
local = ["sentence-transformers>=3.0"]                    # local embeddings on CPU/GPU
qdrant = ["qdrant-client>=1.7"]                            # optional vector backend
server = ["fastapi>=0.110", "uvicorn>=0.29", "psycopg-pool>=3.2"]  # optional HTTP layer
mcp = ["mcp>=1.2", "psycopg-pool>=3.2"]                    # optional MCP server (stdio/http)
dev = ["pytest>=8.0"]

[project.scripts]
memgres-server = "memgres.server:main"
memgres-mcp = "memgres.mcp_server:main"
memgres-worker = "memgres.worker:main"
memgres-reembed = "memgres.reembed:main"
memgres-relink = "memgres.relink:main"
memgres-grant-superadmin = "memgres.admin_cli:main"
memgres-provision = "memgres.token_cli:main"
memgres-healthcheck = "memgres.healthcheck:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "memgres._version.__version__" }

[tool.setuptools.packages.find]
include = ["memgres*"]

[tool.setuptools.package-data]
memgres = ["migrations/*.sql"]
