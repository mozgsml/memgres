[project]
name = "memgres"
version = "0.1.0"
description = "Drop-in memory for AI agents: one Postgres, lexical + semantic recall, diff-versioned history, GDPR-erasable."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["agent", "memory", "postgres", "pgvector", "embeddings", "semantic-search", "llm"]
dependencies = [
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Semantic recall backends — install only what you use. Cloud embeddings
# (Jina/OpenAI) use the stdlib, so they need no extra.
local = ["sentence-transformers>=3.0"]                    # local embeddings on CPU/GPU
qdrant = ["qdrant-client>=1.7"]                            # optional vector backend
server = ["fastapi>=0.110", "uvicorn>=0.29", "psycopg-pool>=3.2"]  # optional HTTP layer
mcp = ["mcp>=1.2"]                                         # optional MCP (stdio) server
dev = ["pytest>=8.0"]

[project.scripts]
memgres-server = "memgres.server:main"
memgres-mcp = "memgres.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memgres*"]

[tool.setuptools.package-data]
memgres = ["migrations/*.sql"]
