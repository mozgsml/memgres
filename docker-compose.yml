# memgres — one command to a working memory service.
#
#   docker compose up            → pgvector + REST API (:8080) + MCP server (:8765)
#   docker compose --profile qdrant up   → also start Qdrant (optional vector backend)
#
# By default this pulls the published image (no build). Pin a version with
# MEMGRES_VERSION=0.1.0, or build from source by uncommenting `build: .` below.
# Override any limit by putting MEMGRES_* into a local .env (all optional; see
# .env.example). MEMGRES_DATABASE_URL is set here to point at the db service.
name: memgres

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: memgres
      POSTGRES_PASSWORD: memgres
      POSTGRES_DB: memgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memgres -d memgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Uncomment to reach Postgres from the host directly:
    # ports: ["5432:5432"]

  memgres:
    image: ghcr.io/mozgsml/memgres:${MEMGRES_VERSION:-latest}
    # build from source instead of pulling the published image:
    # build: .
    environment:
      MEMGRES_DATABASE_URL: postgresql://memgres:memgres@db:5432/memgres
      # only used when MEMGRES_VECTOR_BACKEND=qdrant (start with --profile qdrant)
      QDRANT_URL: http://qdrant:6333
    env_file:
      - path: .env          # optional: your MEMGRES_* overrides
        required: false
    ports:
      # host port (override with MEMGRES_HOST_PORT) : container always 8080
      - "${MEMGRES_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # slim image has no curl; hit /healthz with stdlib urllib
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s     # migrate runs on startup before serving
    restart: unless-stopped

  # MCP server over Streamable HTTP — point an MCP client at http://localhost:8765/mcp.
  # Same image, just a different command + transport.
  mcp:
    image: ghcr.io/mozgsml/memgres:${MEMGRES_VERSION:-latest}
    # build: .
    command: memgres-mcp
    environment:
      MEMGRES_DATABASE_URL: postgresql://memgres:memgres@db:5432/memgres
      MEMGRES_MCP_TRANSPORT: http
      MEMGRES_MCP_HOST: 0.0.0.0
      MEMGRES_MCP_PORT: "8765"
      QDRANT_URL: http://qdrant:6333
      # single-tenant token (optional): uncomment to isolate this endpoint
      # MEMGRES_NAMESPACES: "true"
      # MEMGRES_TOKEN: change-me
    env_file:
      - path: .env
        required: false
    ports:
      - "${MEMGRES_MCP_HOST_PORT:-8765}:8765"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # override the image's :8080 check — this service listens on :8765 (MCP)
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('localhost',8765),3).close()"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Optional separate vector backend. Only used if MEMGRES_VECTOR_BACKEND=qdrant.
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    volumes:
      - qdrantdata:/qdrant/storage
    # ports: ["6333:6333"]

volumes:
  pgdata:
  qdrantdata:
