<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>memgres</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-8 -8 16 16'%3E%3Cpath d='M0-6.4 5.5-3.2V3.2L0 6.4-5.5 3.2V-3.2Z' fill='%2362e38d' fill-opacity='.25' stroke='%2362e38d' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/static/fonts.css">
<link rel="stylesheet" href="/ui/static/app.css">
<script src="/ui/static/vendor/d3.min.js" defer></script>
<script src="/ui/static/js/app.js" type="module"></script>
</head>
<body>

<!-- ═════════ sign-in: /signin and /signin/admin ═════════ -->
<section class="gate" id="gate" hidden>
  <div class="gate-art"><canvas id="gate-canvas" aria-hidden="true"></canvas>
    <div class="words"><div class="word">mem<i>gres</i></div><p data-i18n="gate.tagline"></p></div>
  </div>
  <div class="gate-door">
    <label class="gate-lang" for="gate-lang"><span data-i18n="acc.language"></span><select id="gate-lang"></select></label>

    <div class="door" id="door-main" hidden>
      <h1 data-i18n="gate.signin"></h1>
      <div class="providers" id="providers"></div>
      <p class="fine" data-i18n="gate.fine"></p>
    </div>

    <form class="door" id="door-admin" hidden autocomplete="off">
      <h1 data-i18n="gate.admin.title"></h1>
      <p class="lead" data-i18n="gate.admin.lead"></p>
      <div class="redirected" id="redirected" data-i18n-html="gate.admin.redirected" hidden></div>
      <div class="field"><label for="admin-token" data-i18n="gate.admin.token"></label><input id="admin-token" name="token" type="password" autocomplete="off" required data-i18n-attr="placeholder:gate.admin.placeholder"></div>
      <p class="fine" data-i18n-html="gate.admin.hint"></p>
      <p class="err" id="admin-err" role="alert" hidden></p>
      <button class="btn adminbtn" id="admin-go" type="submit" data-i18n="gate.admin.go"></button>
      <a class="linkbtn" id="admin-back" href="/signin" data-i18n="gate.admin.back" hidden></a>
    </form>
  </div>
</section>

<!-- ═════════ app ═════════ -->
<div class="shell" id="shell" hidden>
  <div class="mbar">
    <button class="ghost" id="drawer-open" data-i18n-attr="aria-label:side.menu"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <div class="brand">mem<i>gres</i></div>
    <div class="cur" id="mbar-space"></div>
  </div>
  <div class="scrim" id="scrim"></div>

  <aside class="side">
    <div class="side-head">
      <div class="brand"><span class="full">mem<i>gres</i></span><span class="short">m<i>g</i></span></div>
      <button class="ghost" id="collapse" data-i18n-attr="aria-label:side.collapse"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 3v10" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </div>
    <nav class="nav" aria-label="Main">
      <a class="navbtn" href="/memory" data-area="memory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="2.8"/><circle cx="4.5" cy="6" r="2"/><circle cx="19.5" cy="6.5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M9.8 10.4 6.2 7.3M14.2 10.6l3.6-3M13.8 14.3l2.9 3"/></svg><span class="txt" data-i18n="nav.memory"></span></a>
      <a class="navbtn" href="/account" data-area="account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c1.2-3.6 4-5.4 7.2-5.4s6 1.8 7.2 5.4"/></svg><span class="txt" data-i18n="nav.account"></span></a>
      <a class="navbtn admin" href="/admin" data-area="admin" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3 19.5 6v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="m8.8 12 2.2 2.2 4.4-4.4" stroke-linecap="round"/></svg><span class="txt" data-i18n="nav.admin"></span></a>
    </nav>
    <div class="spaces-sec" id="spaces-sec">
      <div class="sec-h"><span data-i18n="side.spaces"></span><span id="spaces-total"></span></div>
      <div class="space-filter" id="space-filter-wrap" hidden>
        <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="#707aa0" stroke-width="1.6"/><path d="m10.4 10.4 3.4 3.4" stroke="#707aa0" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="space-filter" type="search" autocomplete="off" data-i18n-attr="placeholder:side.filter;aria-label:side.filter">
      </div>
      <div class="spacelist" id="spacelist" role="list"></div>
    </div>
    <div class="side-foot">
      <button class="me" id="me" aria-haspopup="true" aria-expanded="false" data-i18n-attr="aria-label:me.label"></button>
      <div class="me-name"><b id="me-name"></b><small id="me-role"></small></div>
    </div>
  </aside>

  <main class="content">
    <section class="area" id="area-memory" hidden></section>
    <section class="area page" id="area-account" hidden></section>
    <section class="area page area-admin" id="area-admin" hidden></section>
  </main>
</div>

<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<noscript>memgres needs JavaScript to show this panel.</noscript>
</body>
</html>
