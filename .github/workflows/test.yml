name: Test

# Reusable test job — the single source of truth for the suite. Called by CI
# (ci.yml) and by the release pipeline (release.yml) so a version tag can never
# publish to PyPI/GHCR without a green run.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # Both mcp SDK generations, because they are both in the wild and their
    # internals differ where memgres has to reach in (the tool-list hook moved
    # between them). Running only the newest let a feature ship DEAD on 2.x:
    # a developer machine a generation behind was green, and the guard around
    # the hook turned "attached to nothing" into silence. `latest` is what a
    # fresh install gets; `<2` is what an existing one is pinned to.
    strategy:
      fail-fast: false
      matrix:
        mcp: ['latest', '<2']
    name: test (mcp ${{ matrix.mcp }})
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memgres
          POSTGRES_PASSWORD: memgres
          POSTGRES_DB: memgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U memgres -d memgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:latest
        ports: ['6333:6333']
    env:
      MEMGRES_TEST_DSN: postgresql://memgres:memgres@localhost:5432/memgres
      MEMGRES_TEST_QDRANT: http://localhost:6333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install (no heavy local-embeddings extra)
        run: |
          pip install -e ".[server,mcp,qdrant]" pytest httpx
          if [ "${{ matrix.mcp }}" != "latest" ]; then
            pip install "mcp${{ matrix.mcp }}"
          fi
          python -c "from importlib.metadata import version; print('mcp', version('mcp'))"
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/collections >/dev/null && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2; exit 1
      - name: Test
        run: pytest -q
