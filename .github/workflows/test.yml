name: Test

# Reusable test job — the single source of truth for the suite. Called by CI
# (ci.yml) and by the release pipeline (release.yml) so a version tag can never
# publish to PyPI/GHCR without a green run.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memgres
          POSTGRES_PASSWORD: memgres
          POSTGRES_DB: memgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U memgres -d memgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:latest
        ports: ['6333:6333']
    env:
      MEMGRES_TEST_DSN: postgresql://memgres:memgres@localhost:5432/memgres
      MEMGRES_TEST_QDRANT: http://localhost:6333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install (no heavy local-embeddings extra)
        run: pip install -e ".[server,mcp,qdrant]" pytest httpx
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/collections >/dev/null && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2; exit 1
      - name: Test
        run: pytest -q
