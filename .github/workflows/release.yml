name: Release to PyPI

# Publishes the package to PyPI on a version tag (e.g. v0.1.0), using PyPI
# Trusted Publishing (OIDC) — no API token stored in the repo. Configure a
# publisher on PyPI first (see docs/PUBLISHING.md).

on:
  push:
    tags: ['v*']

jobs:
  # Gate: a version tag must pass the full suite (the same reusable job CI runs)
  # before anything is built or published. Prevents a red build reaching PyPI.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
